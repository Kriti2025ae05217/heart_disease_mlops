# Prometheus + Grafana for the heart-api. Apply with: kubectl apply -f k8s/monitoring.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global: {scrape_interval: 10s}
    scrape_configs:
      - job_name: heart-api
        metrics_path: /metrics
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: heart-api
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8000"
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: prometheus-pod-reader}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: prometheus-pod-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-pod-reader}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: default}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: cfg, mountPath: /etc/prometheus}]
      volumes: [{name: cfg, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasource}
data:
  ds.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, type: prometheus, url: "http://prometheus:9090", isDefault: true}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: ds, mountPath: /etc/grafana/provisioning/datasources}
      volumes: [{name: ds, configMap: {name: grafana-datasource}}]
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  type: LoadBalancer
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
